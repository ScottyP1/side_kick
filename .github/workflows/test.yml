# Runs the full test suite (`npm --prefix app test`) on every pull request, so nothing reaches main
# (and the Azure deploy) without passing: database layer and end-to-end API tests on SQLite and Postgres,
# then the production build (`next build`). Uses GitHub's free Linux minutes for private repos, a
# throwaway Postgres 17 container, and no secrets: the tests use a fake Claude, a fake Teams connector and
# a fake Microsoft sign-in service. Only official GitHub actions, pinned to exact commits (tag in the comment).
name: Tests

on:
  pull_request:
  workflow_dispatch:
  # deploy.yml runs these same tests on main before it deploys.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database that only lives for this run; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Fail (instead of skipping) if Postgres isn't reachable.
      REQUIRE_POSTGRES: "1"
      # pg_isready / createdb / dropdb (used by tests/run.mjs) and the app's pg client both connect here.
      PGHOST: localhost
      PGUSER: postgres
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/sidekick_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same major version as the Docker image (node:26-slim); node:sqlite is built in.
          node-version: "26"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --no-audit --no-fund
      - run: npm --prefix app test
