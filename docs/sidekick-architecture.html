<!doctype html>
<!--
  Sidekick architecture diagram (pitch slides).

  Two 16:9 slides drawn as inline SVG from the data below:
    1. "Today": what runs now (step 2), Teams -> Azure Bot Service -> dev tunnel -> the app on Cody's Mac.
    2. "Target": the production plan, everything in Microsoft Azure (BLUEPRINT.md sections 4.1-4.6).

  Open the file in a browser and press F11 / full screen; arrow keys or Page Up/Down move between slides.
  Add ?view=today or ?view=target to show one slide only (used to export the PNGs).
  To change the picture, edit the NODES / EDGES lists in each slide definition: coordinates are in a 1600 x 900 grid.
  Self-contained: no external files except the optional Inter font from Google Fonts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidekick Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b16;
    --panel: #0d1324;
    --node: #111a2e;
    --text: #e8edf7;
    --muted: #93a0b8;
    --faint: #5d6a85;
    --line: rgba(148, 163, 184, 0.16);
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
  .slide { height: 100vh; min-height: 100vh; display: grid; place-items: center; scroll-snap-align: start; overflow: hidden; }
  .slide svg { width: min(100vw, 177.78vh); height: auto; display: block; }
  nav { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 6px; z-index: 5; }
  nav button { font: 500 12px/1 Inter, system-ui, sans-serif; color: var(--muted); background: rgba(17, 26, 46, 0.85); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  nav button.on { color: var(--text); border-color: rgba(91, 157, 255, 0.6); }
  body.single nav { display: none; }
  body.single .slide.off { display: none; }

  svg text { font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
  .pulse { stroke-dasharray: 1.5 13; stroke-linecap: round; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -29; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<main id="deck"></main>
<nav id="nav"></nav>
<script>
/* Colors: one per kind of thing (nodes) and per kind of connection (lines). */
const C = {
  blue: "#5b9dff", amber: "#f5b544", coral: "#ef8a62", green: "#3dd68c", violet: "#b48cff",
  gray: "#7c8aa5", pink: "#f472b6", teal: "#2dd4bf", teams: "#8b8ff0", slate: "#a7b3c8",
};

/* Simple line icons on a 24 x 24 grid (drawn for this file, no icon library). */
const ICONS = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.6 3.5 5.7"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 14h4"/>',
  bot: '<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="3.6" r="1.3"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/><path d="M2 12.5v3.5M22 12.5v3.5"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',

  browser: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M7 13h6M7 16h10"/><circle cx="6.3" cy="6.5" r=".5"/><circle cx="8.8" cy="6.5" r=".5"/>',

  sparkle: '<path d="M11 3l1.9 5.6 5.6 1.9-5.6 1.9L11 18l-1.9-5.6L3.5 10.5l5.6-1.9z"/><path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',

  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/>',
  grid: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  video: '<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/>',
  mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/>',
  box: '<path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/>',
  server: '<rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>',
  network: '<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M10.8 7.2L6.3 15.8M13.2 7.2l4.5 8.6M7.5 18h9"/>',
  laptop: '<rect x="4" y="4.5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/>',
  queue: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  pulse: '<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',
  lock: '<rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>',
  translate: '<path d="M4 5h9M8.5 3v2c0 4-2 7-5 9M6 9c1.5 2.5 3.5 4 6 5"/><path d="M13 21l4-9 4 9M14.5 18h5"/>',
  scan: '<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 10h8M8 14h5"/>',
};

let P = ""; // id prefix of the slide being drawn (two inline SVGs must not share ids)
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const icon = (name, x, y, size, color) =>
  `<g transform="translate(${x} ${y}) scale(${size / 24})" fill="none" stroke="${color}" stroke-width="${1.7 * 24 / size}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</g>`;
const text = (x, y, s, o = {}) =>
  `<text x="${x}" y="${y}" fill="${o.fill || "var(--text)"}" font-size="${o.size || 13}" font-weight="${o.weight || 400}" text-anchor="${o.anchor || "start"}"${o.ls ? ` letter-spacing="${o.ls}"` : ""}>${esc(s)}</text>`;

/* A rounded-square node: colored icon tile, title, up to two short lines, optional chips and badge. */
function node(n) {
  const w = n.w || 140, h = n.h || 124, col = C[n.c], cx = n.x + w / 2;
  let s = `<g>`;
  s += `<rect x="${n.x}" y="${n.y}" width="${w}" height="${h}" rx="20" fill="url(#${P}nodeFill)" stroke="${col}" stroke-opacity="0.5" stroke-width="1.3"/>`;
  s += `<rect x="${n.x + 1}" y="${n.y + 1}" width="${w - 2}" height="${h - 2}" rx="19" fill="none" stroke="#fff" stroke-opacity="0.04"/>`;
  s += `<rect x="${cx - 22}" y="${n.y + 14}" width="44" height="44" rx="13" fill="${col}" fill-opacity="0.15" stroke="${col}" stroke-opacity="0.35"/>`;
  s += icon(n.i, cx - 12, n.y + 24, 24, col);
  s += text(cx, n.y + 78, n.t, { size: 14.5, weight: 600, anchor: "middle" });
  (n.s || []).forEach((line, k) => { s += text(cx, n.y + 96 + k * 14.5, line, { size: 11.5, fill: "var(--muted)", anchor: "middle" }); });
  if (n.chips) {
    const cw = (w - 20 - (n.chips.length - 1) * 8) / n.chips.length;
    n.chips.forEach((chip, k) => {
      const x = n.x + 10 + k * (cw + 8);
      s += `<rect x="${x}" y="${n.y + h - 38}" width="${cw}" height="24" rx="12" fill="${col}" fill-opacity="0.12" stroke="${col}" stroke-opacity="0.35"/>`;
      s += text(x + cw / 2, n.y + h - 22, chip, { size: 11.5, weight: 500, anchor: "middle", fill: "#f3d6c8" });
    });
  }
  if (n.badge) {
    const bw = n.badge.length * 7 + 16;
    s += `<rect x="${n.x + w - bw + 8}" y="${n.y - 10}" width="${bw}" height="20" rx="10" fill="${col}"/>`;
    s += text(n.x + w - bw / 2 + 8, n.y + 4, n.badge, { size: 10.5, weight: 700, anchor: "middle", fill: "#0b1020", ls: 0.6 });
  }
  return s + `</g>`;
}

/* A small pill node (used for minor pieces such as the Teams admin catalog). */
function pill(p) {
  const col = C[p.c];
  return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="34" rx="17" fill="var(--node)" stroke="${col}" stroke-opacity="0.5"/>` +
    icon(p.i, p.x + 12, p.y + 8, 18, col) + text(p.x + 38, p.y + 22, p.t, { size: 12, weight: 500 });
}

/* Polyline with rounded corners, so elbow connectors look drawn rather than plotted. */
function pathD(pts, r = 12) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(x - px, y - py), l2 = Math.hypot(nx - x, ny - y), rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = x - (x - px) / l1 * rr, ay = y - (y - py) / l1 * rr, bx = x + (nx - x) / l2 * rr, by = y + (ny - y) / l2 * rr;
    d += ` L${ax} ${ay} Q${x} ${y} ${bx} ${by}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]} ${last[1]}`;
}

/* A connection: colored line with arrowhead, a moving dotted "flow" on top, optional numbered badges and label. */
function edge(e) {
  const col = C[e.c], d = pathD(e.p);
  let s = `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-opacity="${e.dash ? 0.85 : 0.75}"${e.dash ? ' stroke-dasharray="5 6"' : ""} marker-end="url(#${P}arrow-${e.c})"/>`;
  if (!e.dash) s += `<path class="pulse" d="${d}" fill="none" stroke="${col}" stroke-width="3.2"/>`;
  (e.b || []).forEach(([t, x, y]) => {
    s += `<circle cx="${x}" cy="${y}" r="10.5" fill="${col}" stroke="var(--bg)" stroke-width="3"/>`;
    s += text(x, y + 4, t, { size: 11, weight: 700, anchor: "middle", fill: "#0b1020" });
  });
  if (e.l) s += text(e.l[1], e.l[2], e.l[0], { size: 11.5, fill: col, anchor: e.l[3] || "middle", weight: 500 });
  return s;
}

/* A soft background area (a cloud, a tenant, a computer). */
function zone(z) {
  const col = z.c ? C[z.c] : "#94a3b8";
  let s = `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="26" fill="${col}" fill-opacity="${z.fill || 0.025}" stroke="${col}" stroke-opacity="${z.c ? 0.4 : 0.2}" stroke-width="1.2"${z.solid ? "" : ' stroke-dasharray="4 7"'}/>`;
  if (z.label) s += text(z.lx ?? z.x + 18, z.ly ?? z.y + z.h - 14, z.label, { size: 11, weight: 600, fill: z.c ? col : "var(--faint)", ls: 1.4, anchor: z.anchor || "start" });
  return s;
}

/* Header shared by both slides: kicker pill, title, one-line subtitle, brand mark. */
function header(h) {
  const col = C[h.c], kw = h.kicker.length * 8.1 + 30;
  return `<rect x="50" y="28" width="${kw}" height="24" rx="12" fill="${col}" fill-opacity="0.14" stroke="${col}" stroke-opacity="0.55"/>` +
    `<circle cx="64" cy="40" r="3.5" fill="${col}"/>` + text(74, 44, h.kicker, { size: 11, weight: 700, fill: col, ls: 1.2 }) +
    text(50, 88, h.title, { size: 30, weight: 700 }) + text(50, 114, h.sub, { size: 14, fill: "var(--muted)" }) +
    icon("sparkle", 1442, 30, 22, C.teal) + text(1550, 47, "Sidekick", { size: 17, weight: 700, anchor: "end" }) +
    text(1550, 68, "AI teammate for Teams", { size: 12, fill: "var(--muted)", anchor: "end" });
}

/* Legend rows: [color, label, dashed?]. Vertical (box) or horizontal (strip). */
function legend(items, x, y, horizontal) {
  let s = "", cx = x, cy = y;
  items.forEach(([c, label, dash]) => {
    s += `<path d="M${cx} ${cy} h26" stroke="${C[c]}" stroke-width="2.4"${dash ? ' stroke-dasharray="5 4"' : ""} marker-end="url(#${P}arrow-${c})"/>`;
    s += text(cx + 36, cy + 4, label, { size: 11.5, fill: "var(--muted)" });
    if (horizontal) cx += 46 + label.length * 6.4 + 22; else cy += 25;
  });
  return s;
}

function defs() {
  let s = `<defs><linearGradient id="${P}nodeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#0f1729"/></linearGradient>` +
    `<radialGradient id="${P}glow1" cx="0.18" cy="0.1" r="0.7"><stop offset="0" stop-color="#1d3a7a" stop-opacity="0.35"/><stop offset="1" stop-color="#070b16" stop-opacity="0"/></radialGradient>` +
    `<radialGradient id="${P}glow2" cx="0.85" cy="0.9" r="0.6"><stop offset="0" stop-color="#0f5e57" stop-opacity="0.22"/><stop offset="1" stop-color="#070b16" stop-opacity="0"/></radialGradient>` +
    `<pattern id="${P}dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.035"/></pattern>`;
  for (const k of Object.keys(C)) {
    s += `<marker id="${P}arrow-${k}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="${C[k]}"/></marker>`;
  }
  return s + `</defs>`;
}

/* ---------- Slide 1: today (step 2, working) ---------- */
function today() {
  let s = header({
    c: "green", kicker: "TODAY · STEP 2 · WORKING",
    title: "How Sidekick works today",
    sub: "Live in the Sidekick Labs test org since Oct 15, 2026: Teams reaches the app on Cody's Mac through Azure Bot Service and a dev tunnel.",
  });
  s += zone({ x: 218, y: 136, w: 532, h: 448, label: "MICROSOFT CLOUD" });
  s += zone({ x: 780, y: 150, w: 590, h: 640, c: "teal", fill: 0.035, solid: true });
  s += icon("laptop", 1328, 166, 20, C.teal);
  s += text(1318, 180, "Sidekick app", { size: 14, weight: 700, anchor: "end" });
  s += text(1350, 198, "Next.js (React) · runs on Cody's Mac", { size: 11.5, fill: "var(--muted)", anchor: "end" });

  const E = [
    { c: "blue", p: [[190, 236], [230, 236]], b: [["1", 210, 236]] },
    { c: "blue", p: [[370, 236], [410, 236]] },
    { c: "blue", p: [[550, 236], [590, 236]], b: [["2", 570, 236]] },
    { c: "blue", p: [[730, 236], [800, 236]], b: [["3", 765, 236]] },
    { c: "amber", p: [[855, 205], [855, 170], [480, 170], [480, 190]], b: [["6", 640, 170], ["C", 666, 170]], l: ["cards go straight back", 690, 164, "start"] },
    { c: "amber", p: [[410, 280], [370, 280]] },
    { c: "amber", p: [[230, 280], [190, 280]] },
    { c: "violet", dash: true, p: [[480, 440], [480, 314]], l: ["app identity", 490, 384, "start"] },
    { c: "violet", dash: true, p: [[550, 482], [760, 482], [760, 300], [800, 300]], l: ["signed token checked", 655, 474] },
    { c: "green", p: [[720, 702], [840, 702], [840, 535]], b: [["A", 772, 702]] },
    { c: "gray", p: [[885, 329], [885, 405]], b: [["4", 885, 366]] },
    { c: "gray", p: [[1075, 329], [1075, 405]] },
    { c: "gray", p: [[955, 535], [955, 620]] },
    { c: "gray", p: [[1140, 535], [1140, 620]] },
    { c: "gray", p: [[1040, 682], [1110, 682]] },
    { c: "coral", p: [[1160, 470], [1420, 470]], b: [["5", 1192, 470], ["B", 1218, 470]], l: ["question + passages", 1320, 460] },
  ];
  E.forEach((e) => { s += edge(e); });

  [
    { x: 50, y: 190, i: "user", c: "slate", t: "Teams user", s: ["@Sidekick in a", "channel or chat"] },
    { x: 230, y: 190, i: "chat", c: "teams", t: "Microsoft Teams", s: ["Sidekick Labs", "test org"] },

    { x: 580, y: 640, w: 140, i: "file", c: "green", t: "Transcript", s: ["Teams .vtt file,", "imported in portal"] },
    { x: 800, y: 205, w: 170, i: "code", c: "teal", t: "Teams bot endpoint", s: ["/api/messages", "Teams SDK"] },
    { x: 990, y: 205, w: 170, i: "browser", c: "teal", t: "Client portal", s: ["docs · meetings · Q&A", "workspace walls"] },
    { x: 1180, y: 205, w: 170, i: "gauge", c: "teal", t: "Owner Console", s: ["spend · errors", "kill switches"] },
    { x: 800, y: 405, w: 360, h: 130, i: "sparkle", c: "coral", t: "AI brain", chips: ["Ask + sources", "Meeting notes", "Knowledge map"] },
    { x: 870, y: 620, w: 170, i: "search", c: "green", t: "Keyword search", s: ["only this org +", "linked workspace"] },

  ].forEach((n) => { s += node(n); });

  // Step-by-step panel (numbers match the badges on the lines).
  s += `<rect x="40" y="600" width="520" height="262" rx="18" fill="var(--panel)" stroke="var(--line)"/>`;

    text(x + 26, y, l1, { size: 12, fill: "var(--text)" }) + text(x + 26, y + 15, l2, { size: 12, fill: "var(--muted)" });

    ["3", C.blue, "The dev tunnel carries it to", "the app on Cody's Mac"],
    ["4", C.gray, "The app checks the token, then", "searches only the linked workspace"],
    ["5", C.coral, "Claude writes the answer and", "cites its sources"],
    ["6", C.amber, "The answer card goes back", "to Teams through Bot Service"],
  ].forEach(([b, col, l1, l2], k) => { s += step(60, 658 + k * 34, b, col, l1, l2); });
  [

/* Build the slides, the nav buttons and keyboard paging. */
const SLIDES = [["today", "Today", today], ["target", "Target", target]];
const deck = document.getElementById("deck"), nav = document.getElementById("nav");
const view = new URLSearchParams(location.search).get("view");
if (view) document.body.classList.add("single");
SLIDES.forEach(([id, label, draw]) => {
  P = id + "-";
  const sec = document.createElement("section");
  sec.className = "slide" + (view && view !== id ? " off" : "");
  sec.id = id;
  sec.innerHTML = `<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sidekick architecture: ${label}">${defs()}` +
    `<rect width="1600" height="900" fill="var(--bg)"/><rect width="1600" height="900" fill="url(#${P}glow1)"/><rect width="1600" height="900" fill="url(#${P}glow2)"/><rect width="1600" height="900" fill="url(#${P}dots)"/>` +
    draw() + `</svg>`;
  deck.appendChild(sec);
  const btn = document.createElement("button");
  btn.textContent = label;
  btn.onclick = () => sec.scrollIntoView({ behavior: "smooth" });
  nav.appendChild(btn);
});
const sections = [...document.querySelectorAll(".slide")];
const current = () => Math.round(scrollY / innerHeight);
const mark = () => [...nav.children].forEach((b, k) => b.classList.toggle("on", k === current()));
addEventListener("scroll", mark, { passive: true }); mark();
addEventListener("keydown", (ev) => {
  const step = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[ev.key];
  if (!step || view) return;
  ev.preventDefault();
  sections[Math.max(0, Math.min(sections.length - 1, current() + step))].scrollIntoView({ behavior: "smooth" });
});
</script>
