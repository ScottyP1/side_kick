<meta charset="utf-8">
<title>Sidekick for Accenture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav) + scrolling work area; stacks to top bar + content under 860px. */
:root{
  --accent-default:#A100FF;
  --bg:#f7f6f9; --surface:#ffffff; --sunken:#f0eef3; --line:#e2dee8; --fg:#121014; --muted:#5f5968; --faint:#8d8696;
  --accent:#A100FF; --accent-soft:#f3e6ff; --accent-fg:#ffffff;
  --hand:#b86a00; --hand-soft:#fbeed6;
  --good:#1d7a3e; --good-soft:#dff1e5; --warn:#9a6200; --warn-soft:#fbefd4; --bad:#b3261e; --bad-soft:#f9e0de; --info:#2a5ba8; --info-soft:#e0e9f7;
  --rail:#000000; --rail-fg:#cfc8d8; --rail-active:#1c1424;
  --f-display:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,32,31,.06), 0 4px 16px rgba(20,32,31,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0a0d; --surface:#151219; --sunken:#1c1822; --line:#2c2634; --fg:#ece8f2; --muted:#a59db0; --faint:#766e82;
  --accent:#BE82FF; --accent-soft:#2a1640; --accent-fg:#1a0033;
  --hand:#f0a43a; --hand-soft:#3a2a12;
  --good:#5cc684; --good-soft:#16301f; --warn:#e7b04f; --warn-soft:#34290f; --bad:#f08a80; --bad-soft:#3a1a18; --info:#82a8ec; --info-soft:#18243a;
  --rail:#000000; --rail-fg:#b3abbe; --rail-active:#1d1427; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0a0d; --surface:#151219; --sunken:#1c1822; --line:#2c2634; --fg:#ece8f2; --muted:#a59db0; --faint:#766e82;
  --accent:#BE82FF; --accent-soft:#2a1640; --accent-fg:#1a0033;
  --hand:#f0a43a; --hand-soft:#3a2a12;
  --good:#5cc684; --good-soft:#16301f; --warn:#e7b04f; --warn-soft:#34290f; --bad:#f08a80; --bad-soft:#3a1a18; --info:#82a8ec; --info-soft:#18243a;
  --rail:#000000; --rail-fg:#b3abbe; --rail-active:#1d1427; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-fg);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#A100FF;display:grid;place-items:center;color:var(--accent-fg);font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:16px;color:#f2f6f5}
.brand small{display:block;font-size:11px;color:var(--rail-fg);opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.55;padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;font-size:13.5px}
.nav button:hover{background:var(--rail-active);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 #A100FF}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:#A100FF;color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-foot{margin-top:auto;font-size:12px;padding:10px;border-top:1px solid #ffffff14;display:flex;flex-direction:column;gap:6px}
.rail-foot select{background:var(--rail-active);border:1px solid #ffffff1f;border-radius:6px;padding:4px 6px;color:#e8efed}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;width:100%}
.topbar .spacer{flex:1}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:640px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.hand{background:var(--hand-soft);color:var(--hand)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted);white-space:nowrap}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunken)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--sunken)}
td.r,th.r{text-align:right}

.meter{height:10px;background:var(--sunken);border-radius:99px;overflow:hidden;position:relative}
.meter > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter > i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.meter.over > span{background:linear-gradient(90deg,var(--accent) 0 var(--cut),var(--warn) var(--cut))}
.bar-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 64px;gap:12px;align-items:center;padding:6px 0}
.bar{height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:pulse 1.8s infinite;margin-top:6px;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.dot-live{animation:none}}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:500;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%}
textarea.input{min-height:80px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.switch{position:relative;width:36px;height:20px;flex:none;border-radius:99px;background:var(--line);border:0;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunken);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:12.5px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.drop{border:1.5px dashed var(--faint);border-radius:var(--r);padding:22px;text-align:center;background:var(--sunken);display:flex;flex-direction:column;gap:6px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

.callout{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:var(--hand-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--hand) 30%,transparent)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

.model{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.model .name{font-family:var(--f-mono);font-size:13px}
.stat-line{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.stat-line:last-child{border-bottom:0}

.flow{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:4px}
.flow-step{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);min-width:150px;flex:1;font-size:13px}
.flow-arrow{align-self:center;color:var(--faint);flex:none}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.app-tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;aspect-ratio:1/1;justify-content:center;min-width:0;transition:border-color .15s, transform .15s, box-shadow .15s}
.app-tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.app-tile b{font-size:14px}
.app-tile .muted{font-size:12px;line-height:1.3}
.app-tile:not(.on) .app-ico{filter:saturate(.35);opacity:.75}
.app-tile:not(.on):hover .app-ico{filter:none;opacity:1}
.app-ico{display:grid;place-items:center;border-radius:12px;font-family:var(--f-display);font-weight:700;flex:none;letter-spacing:-.02em}
.app-status{position:absolute;top:10px;right:10px}
.dot{display:block;width:9px;height:9px;border-radius:50%}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)}
.app-cta{margin-top:4px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px}
.app-cta.warn{color:var(--warn);background:var(--warn-soft)}
@media (prefers-reduced-motion: reduce){.app-tile{transition:none}.app-tile:hover{transform:none}}
@media (max-width: 480px){.app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app-tile{aspect-ratio:auto}}
.logo-slot{width:150px;height:56px;border:1px dashed var(--faint);border-radius:8px;display:grid;place-items:center;background:var(--surface);padding:6px}
.logo-slot img{max-width:100%;max-height:100%;object-fit:contain}
.swatch-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch-btn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.brand-logo{flex-direction:column;align-items:flex-start;gap:6px}
.brand-logo img{max-width:180px;max-height:40px;object-fit:contain;background:#fff;border-radius:6px;padding:4px 8px}
.ws-card{display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ws-card:hover{border-color:var(--accent)}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}

.transcript{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;padding-right:6px}
.utt{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;font-size:13.5px}
.utt .who{font-weight:600}
.utt.sk .who{color:var(--accent)}
.utt.hand{background:var(--hand-soft);border-radius:8px;padding:8px}
.ts{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}

.modal-bg{position:fixed;inset:0;background:rgba(10,16,15,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .panel-h{position:sticky;top:0;background:var(--surface)}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunken);color:var(--muted)}
.steps span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13.5px;max-width:340px}

.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.mobile-nav{display:none}
@media (max-width: 1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-nav{display:flex;gap:8px;align-items:center;width:100%}
  .mobile-nav select{flex:1;min-width:0}
  .topbar{padding:10px 16px}
  .content{padding:18px 16px 40px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:minmax(0,1fr) 56px}
  .bar-row .bar{grid-column:1 / -1;grid-row:2}
  .search{max-width:none}
}
@media (max-width: 480px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .v{font-size:22px}}
</style>

function Modal({ title, onClose, children, footer }) {
  useEffect(() => { const k = e => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return html`<div className="modal-bg" onClick=${e => e.target === e.currentTarget && onClose()}>
    <div className="modal" role="dialog" aria-modal="true" aria-label=${title}>
      <div className="panel-h"><h2>${title}</h2><button className="btn ghost small" onClick=${onClose} aria-label="Close"><${Icon} n="x" /></button></div>
      <div className="panel-b" style=${{display:"flex",flexDirection:"column",gap:"14px"}}>${children}</div>
      ${footer && html`<div className="modal-f">${footer}</div>`}
    </div></div>`;
}

/* ---------- Charts ---------- */
function AreaChart({ data, height = 190 }) {
  const W = 640, H = height, pl = 34, pr = 10, pt = 12, pb = 26;
  const max = 10, x = i => pl + i * (W - pl - pr) / (data.length - 1), y = v => pt + (H - pt - pb) * (1 - v / max);
  const line = data.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const area = line + ` L${x(data.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const last = data.length - 1;
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Meeting hours per day, Oct 1 to Oct 14">
    ${[0, 2.5, 5, 7.5, 10].map(t => html`<g key=${t}><line className="grid-l" x1=${pl} x2=${W - pr} y1=${y(t)} y2=${y(t)} /><text x=${pl - 6} y=${y(t) + 4} textAnchor="end">${t}</text></g>`)}
    <path d=${area} fill="var(--accent)" fillOpacity="0.14" />
    <path d=${line} fill="none" stroke="var(--accent)" strokeWidth="2.2" strokeLinejoin="round" />
    ${data.map((v, i) => ((i % 3 === 0 && last - i >= 2) || i === last) && html`<text key=${"l" + i} x=${x(i)} y=${H - 6} textAnchor="middle">Oct ${i + 1}</text>`)}
    <circle cx=${x(last)} cy=${y(data[last])} r="4.5" fill="var(--accent)" stroke="var(--surface)" strokeWidth="2" />
    <text x=${x(last) - 8} y=${y(data[last]) - 10} textAnchor="end" style=${{fill:"var(--fg)",fontWeight:600}}>${data[last]} h today</text>
  </svg>`;
}
function StackBar({ parts }) {
  const total = parts.reduce((a, p) => a + p.v, 0);
  return html`<div>
    <div style=${{display:"flex",height:"14px",borderRadius:"99px",overflow:"hidden",background:"var(--sunken)"}}>
      ${parts.map(p => html`<span key=${p.k} title=${p.k + ": " + p.v} style=${{width: (p.v / total * 100) + "%", background: p.c}}></span>`)}
    </div>
    <div className="legend" style=${{marginTop:"10px"}}>${parts.map(p => html`<span key=${p.k}><i style=${{background:p.c}}></i>${p.k} <b className="num" style=${{color:"var(--fg)"}}>${p.label || p.v}</b></span>`)}</div>
  </div>`;
}

function Connectors() {
  const toast = useToast();
  const [apps, setApps] = useState(APPS);
  const [open, setOpen] = useState(null);
  const [draft, setDraft] = useState(null);
  const [filter, setFilter] = useState("All");
  const levels = ["Read-only","Draft","Voice confirm","Auto"];
  const start = a => { setOpen(a.id); setDraft(JSON.parse(JSON.stringify({ ...a, wsSel: a.status === "Connected" || a.status === "Needs attention" ? ["contoso","fabrikam"] : [] }))); };
  const save = connect => {
    setApps(apps.map(x => x.id === draft.id ? { ...draft, status: connect ? "Connected" : draft.status, sync: connect ? "just now" : draft.sync } : x));
    toast(connect ? draft.name + " connected. Sidekick can now use it in " + draft.wsSel.length + " workspace" + (draft.wsSel.length === 1 ? "" : "s") + "." : draft.name + " settings saved");
    setOpen(null);
  };
  const counts = { All: apps.length, Connected: apps.filter(a => a.status === "Connected").length, "Needs attention": apps.filter(a => a.status === "Needs attention").length, "Not connected": apps.filter(a => a.status === "Not connected").length };
  const shown = apps.filter(a => filter === "All" || a.status === filter);

  return html`<${React.Fragment}>
    <div className="page-head"><div><div className="eyebrow">Connectors</div><h1>Give Sidekick access to your tools</h1><p>Click a tool to connect it or change what Sidekick may see and do. Every connection uses your own sign-in, so no passwords are stored.</p></div>
      <div className="seg">${Object.keys(counts).map(k => html`<button key=${k} aria-pressed=${filter === k ? "true" : "false"} onClick=${() => setFilter(k)}>${k} <span className="faint num">${counts[k]}</span></button>`)}</div></div>
    ${APP_GROUPS.map(g => { const list = shown.filter(a => a.g === g); return list.length > 0 && html`<section key=${g} style=${{display:"flex",flexDirection:"column",gap:"10px"}}>
      <div className="eyebrow">${g}</div>
      <div className="app-grid">${list.map(a => html`<button key=${a.id} className=${"app-tile" + (isOn(a) ? " on" : "")} onClick=${() => start(a)} aria-label=${"Configure " + a.name}>
        <span className="app-status">${a.status === "Connected" ? html`<span className="dot good" title="Connected"></span>` : a.status === "Needs attention" ? html`<span className="dot warn" title="Needs attention"></span>` : null}</span>
        <${AppIcon} a=${a} size=${48} />
        <b>${a.name}</b>
        <span className="muted">${a.desc}</span>
        <span className=${"app-cta" + (a.status === "Needs attention" ? " warn" : "")}>${a.status === "Connected" ? a.level : a.status === "Needs attention" ? "Reconnect" : "Connect"}</span>
      </button>`)}</div></section>`; })}
    ${open && draft && html`<${Modal} title=${(isOn(draft) ? "Configure " : "Connect ") + draft.name} onClose=${() => setOpen(null)}
      footer=${html`${isOn(draft) && !draft.required && html`<button className="btn danger" style=${{marginRight:"auto"}} onClick=${() => { setApps(apps.map(x => x.id === draft.id ? { ...x, status:"Not connected" } : x)); setOpen(null); toast(draft.name + " disconnected. Sidekick no longer has access."); }}>Disconnect</button>`}<button className="btn" onClick=${() => setOpen(null)}>Cancel</button>${draft.status === "Connected" ? html`<button className="btn primary" onClick=${() => save(false)}>Save</button>` : html`<button className="btn primary" disabled=${draft.wsSel.length === 0} onClick=${() => save(true)}>${draft.status === "Needs attention" ? "Sign in again" : "Sign in & connect"}</button>`}`}>
      <div style=${{display:"flex",gap:"14px",alignItems:"center"}}><${AppIcon} a=${draft} size=${56} /><div><b style=${{fontSize:"16px"}}>${draft.name}</b><div className="muted">${draft.desc}</div><div style=${{marginTop:"4px"}}><${Pill} kind=${draft.status === "Connected" ? "good" : draft.status === "Needs attention" ? "warn" : ""}>${draft.status}</${Pill}>${draft.sync && draft.status !== "Not connected" && html` <span className="muted" style=${{fontSize:"12.5px"}}>· Last sync ${draft.sync}</span>`}</div></div></div>

    <div className="grid g2">
      <div className="panel"><div className="panel-h"><h2>Organization</h2></div><div className="panel-b" style=${{display:"flex",flexDirection:"column",gap:"14px"}}>
        <div className="field"><label htmlFor="oname">Organization name</label><input id="oname" className="input" defaultValue=${ORG.name} /></div>
        <div className="grid g2" style=${{gap:"12px"}}><div className="field"><label htmlFor="tz">Time zone</label><select id="tz" className="input"><option>Eastern Time (US)</option><option>Central Time (US)</option><option>Pacific Time (US)</option></select></div><div className="field"><label htmlFor="lang">Default language</label><select id="lang" className="input"><option>English (US)</option><option>Spanish</option></select></div></div>
      </div></div>
      <${Branding} />
      <div className="panel"><div className="panel-h"><h2>Notifications</h2><span className="muted">Email and Teams</span></div><div className="panel-b">
        ${N("budget","Budget alerts","At 50%, 80% and 100% of the monthly budget.")}
        ${N("connector","Connector problems","When a tool disconnects or a token expires.")}
        ${N("digest","Weekly digest","Monday summary: meetings, decisions, open questions per workspace.")}
        ${N("drafts","Draft stories waiting","Daily reminder if draft stories are older than 2 days.")}
      </div></div>
    </div>
    <div className="panel"><div className="panel-h"><h2>Help</h2></div><div className="panel-b" style=${{display:"flex",gap:"10px",flexWrap:"wrap"}}><button className="btn" onClick=${() => toast("Help center would open")}>Help center</button><button className="btn" onClick=${() => toast("Support request form would open")}>Contact support</button><span className="pill good" style=${{alignSelf:"center"}}>All systems working</span></div></div>
  </${React.Fragment}>`;
}

/* ---------- Shell ---------- */
const NAV = [
  { g:"Overview", items:[["overview","Overview","home"],["billing","Usage & billing","chart"],["models","AI models & agent","cpu"]] },
  { g:"Manage", items:[["users","Users & access","users"],["workspaces","Workspaces","folder"],["knowledge","Knowledge & docs","doc"],["memory","Memory & gaps","brain"],["meetings","Meetings","video"],["connectors","Connectors","plug"]] },
  { g:"Govern", items:[["policies","Restrictions & policies","shield"],["audit","Security & audit","lock"],["settings","Settings","gear"]] },
];
const ROLE_PAGES = {
  "Org Admin": null,
  "Billing Admin": ["overview","billing","settings"],
  "Workspace Admin": ["overview","knowledge","memory","meetings","connectors","workspaces"],
  "Member": ["overview","knowledge","memory","meetings"],
};

function App() {
  const [page, setPage] = useState(() => { const h = (location.hash || "").slice(1); return NAV.some(g => g.items.some(i => i[0] === h)) ? h : "overview"; });
  const [ws, setWs] = useState("contoso");
  const [meetingId, setMeetingId] = useState(null);
  const [role, setRole] = useState("Org Admin");
  const [toasts, setToasts] = useState([]);
  const [logo, setLogo] = useState(BRAND_DEFAULT.logo);
  const [accent, setAccent] = useState(BRAND_DEFAULT.accent);
  useEffect(() => { const r = document.documentElement.style; if (accent) { r.setProperty("--accent", accent); r.setProperty("--accent-soft", "color-mix(in srgb, " + accent + " 14%, var(--surface))"); r.setProperty("--accent-fg", "#ffffff"); } else { ["--accent","--accent-soft","--accent-fg"].forEach(k => r.removeProperty(k)); } }, [accent]);
  const toast = msg => { const id = Math.random(); setToasts(t => [...t, { id, msg }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200); };
  const allowed = k => !ROLE_PAGES[role] || ROLE_PAGES[role].includes(k);
  const go = (p, w) => { if (w) setWs(w); if (p !== "meetings") setMeetingId(null); setPage(p); try { history.replaceState(null, "", "#" + p); } catch (e) {} window.scrollTo(0, 0); };
  useEffect(() => { if (!allowed(page)) go("overview"); }, [role]);
  const openMeeting = id => { setMeetingId(id); go("meetings"); setMeetingId(id); };
  const navItems = NAV.map(g => ({ g: g.g, items: g.items.filter(i => allowed(i[0])) })).filter(g => g.items.length);
  const pageEl = {
    overview: html`<${Overview} go=${go} openMeeting=${openMeeting} />`,
    billing: html`<${Billing} />`, models: html`<${Models} />`, users: html`<${Users} />`,
    workspaces: html`<${Workspaces} go=${go} />`, knowledge: html`<${Knowledge} key=${ws} wsId=${ws} setWs=${setWs} />`,
    memory: html`<${Memory} go=${go} />`, meetings: html`<${Meetings} openId=${meetingId} setOpenId=${setMeetingId} />`,
    connectors: html`<${Connectors} />`, policies: html`<${Policies} />`, audit: html`<${Audit} />`, settings: html`<${Settings} />`,
  }[page];
  return html`<${BrandCtx.Provider} value=${{ logo, setLogo, accent, setAccent }}><${ToastCtx.Provider} value=${toast}>
    <div className="app">
      <aside className="rail">
        ${logo ? html`<div className="brand brand-logo"><img src=${logo} alt=${ORG.name} /><small>Sidekick · AI teammate</small></div>` : html`<div className="brand"><span className="brand-mark">S</span><div><b>Sidekick</b><small>${ORG.name}</small></div></div>`}
        <nav className="nav" aria-label="Main">${navItems.map(g => html`<${React.Fragment} key=${g.g}><div className="nav-group">${g.g}</div>${g.items.map(([k, l, ic]) => html`<button key=${k} aria-current=${page === k ? "page" : undefined} onClick=${() => go(k)}><${Icon} n=${ic} />${l}${k === "meetings" && html`<span className="count">2 live</span>`}${k === "memory" && html`<span className="count">6 gaps</span>`}</button>`)}</${React.Fragment}>`)}</nav>
        <div className="rail-foot"><label htmlFor="rolepick">Preview as role (mockup)</label><select id="rolepick" value=${role} onChange=${e => setRole(e.target.value)}>${Object.keys(ROLE_PAGES).map(r => html`<option key=${r}>${r}</option>`)}</select></div>
      </aside>
      <div className="main">
        <header className="topbar">
          <div className="mobile-nav"><span className="brand-mark">S</span><select className="input" value=${page} onChange=${e => go(e.target.value)} aria-label="Page">${navItems.map(g => g.items.map(([k, l]) => html`<option key=${k} value=${k}>${l}</option>`))}</select><select className="input" style=${{maxWidth:"130px"}} value=${role} onChange=${e => setRole(e.target.value)} aria-label="Preview as role">${Object.keys(ROLE_PAGES).map(r => html`<option key=${r}>${r}</option>`)}</select></div>
          <div className="search"><${Icon} n="search" /><input placeholder="Search meetings, documents, decisions…" aria-label="Search" onKeyDown=${e => { if (e.key === "Enter" && e.target.value.trim()) { toast("Searching all workspaces for “" + e.target.value.trim() + "”"); } }} /></div>
          <span className="spacer"></span>
          <${Pill} kind="accent" nodot>Pilot</${Pill}>
          <button className="btn ghost small" aria-label="Notifications" onClick=${() => go("overview")}><${Icon} n="bell" /></button>
          <span className="avatar" title="Marcus Bell · ${role}">MB</span>
        </header>
        <main className="content">${pageEl}</main>
      </div>
    </div>
    <div className="toasts" aria-live="polite">${toasts.map(t => html`<div key=${t.id} className="toast">${t.msg}</div>`)}</div>
  </${ToastCtx.Provider}></${BrandCtx.Provider}>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
